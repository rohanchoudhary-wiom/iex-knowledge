<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial outages</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    .summary { position: absolute; z-index: 1000; top: 16px; right: 16px; min-width: 160px; padding: 12px 14px; border-radius: 8px; background: #fff; box-shadow: 0 2px 12px #0003; font: 14px system-ui; }
    .summary strong { display: block; font-size: 18px; }
    .legend { margin-top: 8px; line-height: 1.7; }
    .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
  </style>
</head>
<body>
  <main id="map" aria-label="H3 outage map"></main>
  <aside class="summary" aria-live="polite"><strong id="cell-count">Loading…</strong>qualifying H3 cells<div class="legend"><span class="swatch" style="background:#facc15"></span>1–3 hours<br><span class="swatch" style="background:#dc2626"></span>Over 3 hours</div></aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([22.5, 79], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 18
    }).addTo(map);

    const color = severity => severity === "over_3_hours" ? "#dc2626" : "#facc15";
    fetch("outages.geojson")
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(data => {
        const layer = L.geoJSON(data, {
          style: feature => ({ color: "#fff", weight: .6, fillColor: color(feature.properties.severity), fillOpacity: .78 }),
          onEachFeature: (feature, hex) => {
            const p = feature.properties;
            const share = (p.worst_affected_share * 100).toFixed(1);
            const duration = (p.longest_event_minutes / 60).toFixed(1);
            hex.bindTooltip(`<strong>${p.h3_id}</strong><br>Eligible devices: ${p.eligible_devices.toLocaleString()}<br>Qualifying events: ${p.qualifying_events.toLocaleString()}<br>&nbsp;&nbsp;1–3 hours: ${p.events_1_to_3_hours.toLocaleString()}<br>&nbsp;&nbsp;Over 3 hours: ${p.events_over_3_hours.toLocaleString()}<br>Worst impact: ${p.worst_affected_devices.toLocaleString()} / ${p.eligible_devices.toLocaleString()} devices (${share}%)<br>Longest event: ${duration} hours<br>Latest event: ${p.latest_event_start_ist}–${p.latest_event_end_ist} IST<hr>Qualifying event: ≥70% of eligible devices simultaneously had no ping for 1+ hour.`, { sticky: true });
          }
        }).addTo(map);
        if (data.features.length) {
          const hotspot = data.features.reduce((best, feature) => feature.properties.longest_event_minutes > best.properties.longest_event_minutes ? feature : best);
          map.setView(L.geoJSON(hotspot).getBounds().getCenter(), 12);
        }
        document.querySelector("#cell-count").textContent = data.features.length.toLocaleString();
      })
      .catch(error => document.querySelector("#cell-count").textContent = `Failed: ${error.message}`);
  </script>
</body>
</html>
